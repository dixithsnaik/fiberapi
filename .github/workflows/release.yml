name: Release FiberAPI CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish installer assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            tools/install.ps1
            tools/fiber.ps1
